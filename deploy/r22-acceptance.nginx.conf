# Isolated R22 acceptance endpoint. Temporary SSH tunnel to the local test app.
location = /api/integrations/1c/r22-acceptance {
    client_max_body_size 20m;
    access_log /var/log/nginx/r22-acceptance.access.log combined;
    proxy_pass http://127.0.0.1:3312/api/integrations/1c/exchange;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 120s;
    add_header Cache-Control "no-store" always;
}
