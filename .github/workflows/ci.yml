name: CI (fixture-free checks, not release acceptance)

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: axima_test
          POSTGRES_PASSWORD: axima_test_local_only
          POSTGRES_DB: axima_commerce_test
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U axima_test -d axima_commerce_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AXIMA_TEST_DATABASE: '1'
      DATABASE_URL: postgresql://axima_test:axima_test_local_only@127.0.0.1:55432/axima_commerce_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:release-checks
      - run: npm run test:deployment
      - run: npm run check:boundaries
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test -- --reporter=json --outputFile=unit-results.json
      - run: node scripts/assert-test-report.mjs unit-results.json
      - run: npm run worker:build
      - run: npm run test:int:setup
      # Customer snapshot is not committed or downloaded by PR CI.
      # Full replay is mandatory in npm run check:release on the authorized local copy.
      - name: Integration without private snapshot (not release gate)
        run: >-
          npm run test:integration --
          --exclude tests/integration/onec-r16-replay.test.ts
          --exclude tests/integration/onec-r16-6-acceptance.test.ts
          --exclude tests/integration/legacy-ownership-replay.test.ts
          --reporter=json --outputFile=integration-results.json
      - run: node scripts/assert-test-report.mjs integration-results.json
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-free-test-results
          path: |
            unit-results.json
            integration-results.json
          if-no-files-found: warn
