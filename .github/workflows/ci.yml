name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: westside
          POSTGRES_PASSWORD: westside
          POSTGRES_DB: westside
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U westside -d westside"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://westside:westside@localhost:5432/westside
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run check:boundaries
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run test:int:setup
      - run: npm run test:integration
      - run: npm run build
