# Shared local/deployment stack. Production: install.sh/update.sh with immutable --image.
# Migrations and bootstrap are explicit deployment steps, never container startup effects.
# For development, run migrations first; app/worker belong to profile full.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-westside}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-westside}
      POSTGRES_DB: ${POSTGRES_DB:-westside}
    # Bound to loopback only: the app reaches Postgres over the compose network;
    # host access stays available for dev/backup without exposing the DB publicly.
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-westside} -d ${POSTGRES_DB:-westside}']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    restart: unless-stopped
    image: ${APP_IMAGE:-axima-commerce-app:local}
    build:
      context: .
      dockerfile: Dockerfile
    environment: &commerce_environment
      NODE_ENV: production
      # Fixed private path paired with the invoice_media volume below.
      MEDIA_ROOT: /app/.media
      DATABASE_URL: ${DATABASE_URL:-postgresql://westside:westside@postgres:5432/westside}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      STORE_PROFILE_PATH: ${STORE_PROFILE_PATH:-/app/deployment/config/store-profile.json}
      # License runtime guard (M10): enforce and verify the on-disk grant.
      LICENSE_ENFORCE: ${LICENSE_ENFORCE:-1}
      LICENSE_GRANT_PATH: ${LICENSE_GRANT_PATH:-/app/deployment/config/license.json}
      LICENSE_INSTALLATION_KEY_PATH: ${LICENSE_INSTALLATION_KEY_PATH:-/app/deployment/secrets/installation-private-key.pem}
      LICENSE_PUBLISHER_PUBLIC_KEY_PATH: ${LICENSE_PUBLISHER_PUBLIC_KEY_PATH:-/app/deployment/config/publisher-public.pem}
      # 1C "Обмен с сайтом" Basic-auth credentials (the login/password entered in
      # the client's 1C exchange node). Provided via deployment/secrets/.env.
      ONEC_SOURCES_FILE: ${ONEC_SOURCES_FILE:-}
      ONEC_EXCHANGE_CONNECTION_ID: ${ONEC_EXCHANGE_CONNECTION_ID:-}
      ONEC_EXCHANGE_USER: ${ONEC_EXCHANGE_USER:-}
      ONEC_EXCHANGE_PASSWORD: ${ONEC_EXCHANGE_PASSWORD:-}
    # Loopback only: nginx (on the host) proxies to 127.0.0.1:3000; the app is
    # never reachable directly, so all traffic goes through TLS + security headers.
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
    # Deployment config/secrets (store profile + license grant + identity key)
    # read-only; inbound 1C exchange files land in a dedicated writable volume.
    volumes:
      - ./deployment:/app/deployment:ro
      - onec_exchange:/app/exchange
      - invoice_media:/app/.media
# Migrations run only through deploy.mjs after rehearsal; restart/rollback never migrates.
    command: ['node', 'server.js']
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://127.0.0.1:3000/api/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 10s
      timeout: 5s
      retries: 10
    profiles: ['full', 'ed']

  worker:
    image: ${APP_IMAGE:-axima-commerce-app:local}
    environment:
      <<: *commerce_environment
      INTEGRATION_WORKER_INTERVAL_MS: ${INTEGRATION_WORKER_INTERVAL_MS:-5000}
    command: ['node', 'dist/integration-worker.cjs']
    restart: unless-stopped
    stop_grace_period: 16m
    healthcheck:
      test: ['CMD', 'node', 'dist/integration-worker.cjs', '--health']
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./deployment:/app/deployment:ro
      - onec_exchange:/app/exchange
    profiles: ['full']


  # Enabled by deployment tooling when deployment/config/ed.json exists.
  ed:
    image: ${APP_IMAGE:-axima-commerce-app:local}
    environment:
      <<: *commerce_environment
      ED_LISTEN_HOST: 0.0.0.0
      ED_STATE_DIR: /app/exchange/ed
    command: ['node', 'dist/enterprisedata-http-probe.cjs', '/app/deployment/config/ed.json']
    ports:
      - '127.0.0.1:${ED_PORT:-3318}:3318'
    volumes:
      - ./deployment:/app/deployment:ro
      - onec_exchange:/app/exchange
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ['CMD', 'node', 'dist/enterprisedata-http-probe.cjs', '/app/deployment/config/ed.json', '--health']
      interval: 30s
      timeout: 8s
      start_period: 15s
      retries: 3
    depends_on:
      app:
        condition: service_healthy
    profiles: ['ed']

volumes:
  postgres_data:
  onec_exchange:
  invoice_media:
